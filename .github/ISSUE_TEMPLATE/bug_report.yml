name: Bug report
description: Something behaved incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. This is a solo-maintained beta, so please be
        patient with response times.

        **If this is a security problem, stop here** and report it privately
        instead — see `SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
      placeholder: "1.9.2"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 Pro 24H2"
    validations:
      required: true

  - type: dropdown
    id: extension
    attributes:
      label: Was the Chrome extension connected?
      options:
        - "Yes, and its version matches the app"
        - "Yes, but I am not sure the versions match"
        - "No"
        - "I do not have the extension installed"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Relevant log output, or which permissions were enabled at the time
        (read / write / control / exec).
      render: text
