name: Apply worker placement patch

on:
  push:
    branches:
      - fix/worker-placement-autodiscard-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply minimal background-worker discard protection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('extension/background.js')
          source = path.read_text(encoding='utf-8')
          old = '''  try {
            await chrome.tabs.create(create);
            return true;
          } catch {
            // The app keeps a bounded OS-open fallback armed until the marked page actually redeems.
            return false;
          }
          '''
          new = '''  try {
            const created = await chrome.tabs.create(create);
            if (Number.isInteger(created?.id)) {
              try {
                await chrome.tabs.update(created.id, { autoDiscardable: false });
              } catch {
                // The tab already exists. Treating this presentation hardening failure as a
                // placement failure would make the app's bounded OS fallback open a duplicate.
              }
            }
            return true;
          } catch {
            // The app keeps a bounded OS-open fallback armed until the marked page actually redeems.
            return false;
          }
          '''
          count = source.count(old)
          if count == 0 and new in source:
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f'expected one placement block, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Inmerson"
          git config user.email "216765991+Inmerson@users.noreply.github.com"
          git add extension/background.js
          git commit -m "fix: protect background worker tabs from discard"
          git push origin "HEAD:${GITHUB_REF_NAME}"
