name: Apply worker placement patch

on:
  push:
    branches:
      - fix/worker-placement-autodiscard-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply minimal background-worker discard protection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('extension/background.js')
          source = path.read_text(encoding='utf-8')
          start = source.index('async function placeBackgroundWorker')
          end = source.index('\n}\n\nasync function rememberDeferredRevival', start)
          placement = source[start:end + 2]
          old = '    await chrome.tabs.create(create);\n    return true;'
          new = '''    const created = await chrome.tabs.create(create);
              if (Number.isInteger(created?.id)) {
                try {
                  await chrome.tabs.update(created.id, { autoDiscardable: false });
                } catch {
                  // The tab already exists. Treating this presentation hardening failure as a
                  // placement failure would make the app's bounded OS fallback open a duplicate.
                }
              }
              return true;'''
          if old not in placement:
              if 'await chrome.tabs.update(created.id, { autoDiscardable: false });' in placement:
                  raise SystemExit(0)
              raise SystemExit('background worker create/return pair not found')
          patched = placement.replace(old, new, 1)
          path.write_text(source[:start] + patched + source[end + 2:], encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Inmerson"
          git config user.email "216765991+Inmerson@users.noreply.github.com"
          git add extension/background.js
          git commit -m "fix: protect background worker tabs from discard"
          git push origin "HEAD:${GITHUB_REF_NAME}"
