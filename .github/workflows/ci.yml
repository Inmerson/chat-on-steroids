name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-15
          - name: Linux x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          npm run verify:ci 2>&1 | tee verify.log

      - name: Verify
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /d /s /c "npm run verify:ci > verify.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath verify.log
          exit $code

      - name: Upload failed verify log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-${{ matrix.name }}
          path: verify.log
          if-no-files-found: ignore
          retention-days: 3
