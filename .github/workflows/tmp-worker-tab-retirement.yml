name: Temporary worker tab retirement RED

on:
  push:
    branches:
      - tmp/worker-tab-retirement-ci

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prove regression is red on current upstream
        shell: bash
        run: |
          set +e
          npx vitest run test/worker-tab-retirement.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression unexpectedly passes before the fix.' >&2
            exit 1
          fi
          echo 'Regression failed before the fix as expected.'
