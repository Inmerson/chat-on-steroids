name: Temporary clean candidate verification

on:
  push:
    branches:
      - tmp/goal-access-limit-recovery-ci

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build one-commit candidate from current upstream
        shell: bash
        run: |
          cp src/main/bridge.ts /tmp/bridge.ts
          cp test/goal-access-limit-recovery.test.ts /tmp/goal-access-limit-recovery.test.ts
          git checkout -B fix/goal-access-limit-recovery f51acbccdd734f524799ea92bb747be765fba1e4
          cp /tmp/bridge.ts src/main/bridge.ts
          cp /tmp/goal-access-limit-recovery.test.ts test/goal-access-limit-recovery.test.ts
          git config user.name 'Inmerson'
          git config user.email 'Inmerson@users.noreply.github.com'
          git add src/main/bridge.ts test/goal-access-limit-recovery.test.ts
          git commit -m 'fix: preserve Goal recovery across access limits'
      - run: npm ci
      - run: npm run verify
      - name: Publish verified clean candidate
        if: success()
        shell: bash
        run: |
          git push --force-with-lease=refs/heads/fix/goal-access-limit-recovery:f51acbccdd734f524799ea92bb747be765fba1e4 origin HEAD:fix/goal-access-limit-recovery
