name: Temporary Goal access-limit validation

on:
  push:
    branches:
      - tmp/goal-access-limit-recovery-ci

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prove regression fails before fix
        shell: bash
        run: |
          set +e
          npx vitest run test/goal-access-limit-recovery.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression unexpectedly passes before the fix.' >&2
            exit 1
          fi
      - name: Apply minimal owner-preservation patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/main/bridge.ts')
          text = path.read_text(encoding='utf-8')
          old = """    if (\n      item.blocking === true ||\n      /^too many requests\\b.*temporarily limited.*access.*few minutes/i.test((item.text ?? '').replace(/\\s+/g, ' '))\n    ) {\n      endActivity(conversationId);\n      continue;\n    }\n"""
          new = """    if (\n      item.blocking === true ||\n      /^too many requests\\b.*temporarily limited.*access.*few minutes/i.test((item.text ?? '').replace(/\\s+/g, ' '))\n    ) {\n      // Ordinary chats stop their response watchdog exactly as before. Goal/Loop is different:\n      // its standing instruction already owns this chat's bounded silence recovery, so consuming\n      // the exact current grant here parks an unattended run forever after the DOM acknowledges\n      // the dialog. Preserve only that existing owner; the notice itself grants no retry.\n      const grant = activeUntil.get(conversationId);\n      const preserveGoalRecovery = !!sessionId && goalActiveFor(conversationId) &&\n        grant?.sessionId === sessionId && (!item.turnId || grant.turnId === item.turnId);\n      if (!preserveGoalRecovery) endActivity(conversationId);\n      continue;\n    }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one bridge target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Focused access-limit regressions
        run: |
          npx vitest run test/goal-access-limit-recovery.test.ts
          npx vitest run test/bridge.test.ts -t "provider access limit"
      - name: Typecheck
        run: npm run typecheck
      - name: Commit validated source and remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'Inmerson'
          git config user.email 'Inmerson@users.noreply.github.com'
          git rm .github/workflows/tmp-goal-access-limit-recovery.yml
          git add src/main/bridge.ts
          git commit -m 'fix: preserve Goal recovery across access limits'
          git push origin HEAD:tmp/goal-access-limit-recovery-ci
