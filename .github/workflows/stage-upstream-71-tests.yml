name: Stage upstream 71 tests

on:
  push:
    branches:
      - fix/upstream-worker-placement-71

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/upstream-worker-placement-71
          fetch-depth: 0

      - name: Refine live-prime regression fixture
        run: python scripts/refine-upstream-71-tests.py

      - name: Commit regression refinement
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "Inmerson"
            git config user.email "216765991+Inmerson@users.noreply.github.com"
            git add test/bridge.test.ts
            git commit -m "test: model a recorded live prime for placement"
            git push origin HEAD:fix/upstream-worker-placement-71
          fi

      - name: Run focused placement tests
        run: |
          npm ci
          npx vitest run test/bridge.test.ts test/extension.test.ts
