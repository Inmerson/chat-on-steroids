name: Stage upstream 71 tests

on:
  push:
    branches:
      - fix/upstream-worker-placement-71

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/upstream-worker-placement-71
          fetch-depth: 0

      - name: Apply worker placement implementation
        run: python scripts/apply-upstream-71-fix.py

      - name: Commit implementation
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Inmerson"
          git config user.email "216765991+Inmerson@users.noreply.github.com"
          git add src/main/bridge.ts extension/background.js test/extension.test.ts
          git commit -m "fix: keep fresh worker tabs behind the prime"
          git push origin HEAD:fix/upstream-worker-placement-71

      - name: Run focused placement tests
        run: |
          npm ci
          npx vitest run test/bridge.test.ts test/extension.test.ts
