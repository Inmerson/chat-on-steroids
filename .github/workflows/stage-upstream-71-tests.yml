name: Stage upstream 71 tests

on:
  push:
    branches:
      - fix/upstream-worker-placement-71

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/upstream-worker-placement-71
          fetch-depth: 0

      - name: Stage regression tests
        run: python scripts/stage-upstream-71-tests.py

      - name: Commit staged tests
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Inmerson"
          git config user.email "216765991+Inmerson@users.noreply.github.com"
          git add test/bridge.test.ts
          git commit -m "test: cover live-prime worker placement"
          git push origin HEAD:fix/upstream-worker-placement-71

      - name: Run focused bridge tests
        run: |
          npm ci
          npx vitest run test/bridge.test.ts
