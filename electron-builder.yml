appId: com.chatgptlocalfiles.app
productName: ChatGPT Local Files
copyright: MIT licensed

directories:
  output: release
  buildResources: build

# Only the built output ships. Source, tests and dev config stay out of the asar.
files:
  - out/**
  - package.json

# Two things ship outside the asar because they must exist as real files on disk:
#   · tunnel-client (Apache-2.0), fetched at build time by scripts/fetch-tunnel-client.mjs,
#     because it has to be executable
#   · the Chrome extension, because chrome://extensions → Load unpacked reads a folder,
#     and Chrome cannot see inside an asar. Without this the installed app would tell
#     users to load a folder that is not on their machine.
# The app opens resources/extension from its own Chrome extension settings, so this
# path is not merely documentation — extension-path.ts depends on it.
extraResources:
  - from: resources/tunnel
    to: tunnel
    filter:
      - '**/*'
  - from: extension
    to: extension
    filter:
      - '**/*'
      - '!**/*.map'

# No native modules, so there is nothing to rebuild.
npmRebuild: false
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # The app is an ordinary user-level utility. It must never ask for elevation,
  # and a per-user install means the installer does not need it either.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChatGPT Local Files
  artifactName: ChatGPT-Local-Files-Setup-${version}.${ext}
  uninstallDisplayName: ChatGPT Local Files
  # Settings and the encrypted API key live in %APPDATA%\chatgpt-local-files and must
  # outlive an uninstall, so reinstalling or updating never asks for them again.
  # This is the default; it is written down because losing it would be silent.
  deleteAppDataOnUninstall: false
